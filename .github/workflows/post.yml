name: Post approved videos (Review tab)

# Started at the end of every grab (every ~30 min). Builds the daily review reel, schedules what you
# approved (✅) on YouTube through Upload-Post, remakes 👎 clips, and tidies the Review tab.
on:
  workflow_dispatch:
    inputs:
      force_batch:
        description: "yes = make the review reel now (once nothing is still being made)"
        default: "no"

permissions:
  contents: read
  actions: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: robot
        run: pip install requests
      - name: Install ffmpeg (for the review reel)
        timeout-minutes: 4
        continue-on-error: true
        run: |
          if ! command -v ffmpeg >/dev/null; then
            (curl -sSfL --max-time 150 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              && tar -xf /tmp/ff.tar.xz -C /tmp && sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ff* /usr/local/bin/) \
            || (timeout 100 sudo apt-get update -qq; timeout 120 sudo apt-get install -y -qq ffmpeg)
          fi
          ffmpeg -version | head -1
      - name: Reel, schedule, redo, tidy
        id: post
        working-directory: robot
        env:
          UPLOAD_POST_KEY: ${{ secrets.UPLOAD_POST_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          FORCE_BATCH: ${{ inputs.force_batch }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -u poster.py
      - name: Start Claude on 👎 fixes now
        if: steps.post.outputs.fix == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hooks.yml -R ${{ github.repository }}
