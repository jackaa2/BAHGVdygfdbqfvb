name: Make channel versions (captions + watermark)

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # every 10 min
  workflow_dispatch:
    inputs:
      sample_id:
        description: "TEST: make one sample video of this clip ID; changes nothing else"
        required: false
        default: ""
      preview:
        description: "TEST: also upload a preview image of the 6 versions to Drive (_previews)"
        required: false
        default: "no"

concurrency:
  group: edit
  cancel-in-progress: false

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/edit.yml
      - name: Cache speech-to-text model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: models-whisper-small-en-ecapa-v2
      - name: Install (required)
        timeout-minutes: 8
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            (curl -sSfL --max-time 150 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              && tar -xf /tmp/ff.tar.xz -C /tmp && sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ff* /usr/local/bin/) \
            || (timeout 120 sudo apt-get update -qq; timeout 240 sudo apt-get install -y -qq ffmpeg)
          fi
          ffmpeg -hide_banner -filters 2>/dev/null | grep -q " ass " && echo "ffmpeg ok (with captions)"
          pip install -q --timeout 60 --retries 3 requests faster-whisper fonttools pillow
      - name: Install voice check (optional, skipped if slow)
        timeout-minutes: 4
        continue-on-error: true
        run: |
          pip install -q --timeout 30 --retries 1 torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q --timeout 30 --retries 1 speechbrain
      - name: Make versions
        working-directory: robot
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          PREVIEW_DIR: ${{ github.workspace }}/previews
          PREVIEW_UPLOAD: ${{ inputs.preview }}
          SAMPLE_ID: ${{ inputs.sample_id }}
          SAMPLE_DIR: ${{ github.workspace }}/sample
        run: |
          (while true; do free -m | awk 'NR==2{print "   [mem] used " $3 " of " $2 " MB"}'; sleep 15; done) &
          python -u edit.py
      - name: Save sample video
        if: always() && inputs.sample_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: sample
          path: sample/
          retention-days: 3
          if-no-files-found: ignore
      - name: Save preview frames (for checking the look)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: previews
          path: previews/
          retention-days: 3
          if-no-files-found: ignore
