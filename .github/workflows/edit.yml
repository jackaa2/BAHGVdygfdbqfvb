name: Make channel versions (captions + watermark)

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # every 10 min
  workflow_dispatch:
    inputs:
      preview:
        description: "TEST: also upload a preview image of the 6 versions to Drive (_previews)"
        required: false
        default: "no"

concurrency:
  group: edit
  cancel-in-progress: false

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/edit.yml
      - name: Cache speech-to-text model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: models-whisper-small-en-ecapa-v2
      - name: Install
        timeout-minutes: 12
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q --timeout 60 --retries 3 torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q --timeout 60 --retries 3 requests faster-whisper fonttools speechbrain pillow
      - name: Make versions
        working-directory: robot
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          PREVIEW_DIR: ${{ github.workspace }}/previews
          PREVIEW_UPLOAD: ${{ inputs.preview }}
        run: python edit.py
      - name: Save preview frames (for checking the look)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: previews
          path: previews/
          retention-days: 3
          if-no-files-found: ignore
