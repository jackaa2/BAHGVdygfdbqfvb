name: Grab GTA 6 clips

on:
  schedule:
    - cron: "17 * * * *"      # every hour at :17 (UTC). Change to "17 */2 * * *" for every 2 hours.
  workflow_dispatch: {}        # "Run workflow" button for a manual run

concurrency:
  group: grab
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (always the newest yt-dlp, so Twitch changes get picked up)
        run: pip install --upgrade -r requirements.txt
      - name: Grab clips
        working-directory: robot
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python grab.py
