name: Grab GTA 6 clips

on:
  schedule:
    - cron: "17,47 * * * *"   # every 30 min (UTC). Two slots so one delayed/skipped GitHub run is never a big gap.
  workflow_dispatch:           # "Run workflow" button for a manual run
    inputs:
      test_game:
        description: "TEST ONLY: grab from this Twitch category instead (e.g. Grand Theft Auto V). Leave blank for normal."
        required: false
        default: ""
      purge_all:
        description: "DANGER: delete ALL robot clip videos in the clip folders (type yes)"
        required: false
        default: ""
      test_max:
        description: "TEST ONLY: max clips to grab"
        required: false
        default: "5"

concurrency:
  group: grab
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (always the newest yt-dlp, so Twitch changes get picked up)
        run: pip install --upgrade -r requirements.txt
      - name: Grab clips
        working-directory: robot
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          TEST_GAME: ${{ inputs.test_game }}
          TEST_MAX: ${{ inputs.test_max }}
          PURGE_ALL: ${{ inputs.purge_all }}
        run: python grab.py
      - name: Cache speech model (screener)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: screener-whisper-base-en-v1
      - name: Claude screens new clips (score, verdict, hooks)
        if: ${{ inputs.purge_all != 'yes' }}
        continue-on-error: true
        working-directory: robot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q faster-whisper numpy
          python screen.py
