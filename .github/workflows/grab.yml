name: Grab GTA 6 clips

on:
  schedule:
    - cron: "17,47 * * * *"   # every 30 min (UTC). Two slots so one delayed/skipped GitHub run is never a big gap.
  workflow_dispatch:           # "Run workflow" button for a manual run
    inputs:
      test_game:
        description: "TEST ONLY: grab from this Twitch category instead (e.g. Grand Theft Auto V). Leave blank for normal."
        required: false
        default: ""
      purge_all:
        description: "DANGER: delete ALL robot clip videos in the clip folders (type yes)"
        required: false
        default: ""
      check_posting:
        description: "Only check the Upload-Post key + profiles (type yes)"
        required: false
        default: ""
      fix_raw:
        description: "Re-wrap raw clips already in the sheet so Drive/trimmer can play them (type yes)"
        required: false
        default: ""
      purge_ids:
        description: "Delete the videos of these clip IDs (comma separated)"
        required: false
        default: ""
      test_kick:
        description: "TEST ONLY: grab Kick clips (any game) from the Kick streamers on the Streamers tab (type yes)"
        required: false
        default: ""
      test_max:
        description: "TEST ONLY: max clips to grab"
        required: false
        default: "5"

permissions:
  contents: read
  actions: write

concurrency:
  group: grab
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (always the newest yt-dlp, so Twitch changes get picked up)
        run: pip install --upgrade -r requirements.txt
      - name: Install ffmpeg (cleans clips so Drive can play them; grabbing still works without it)
        timeout-minutes: 4
        continue-on-error: true
        run: |
          if ! command -v ffmpeg >/dev/null; then
            (curl -sSfL --max-time 150 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              && tar -xf /tmp/ff.tar.xz -C /tmp && sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ff* /usr/local/bin/) \
            || (timeout 100 sudo apt-get update -qq; timeout 120 sudo apt-get install -y -qq ffmpeg)
          fi
          ffmpeg -version | head -1
      - name: Check Upload-Post connection
        if: inputs.check_posting == 'yes'
        working-directory: robot
        env:
          UPLOAD_POST_KEY: ${{ secrets.UPLOAD_POST_KEY }}
        run: python -u upload_post_check.py
      - name: Grab clips
        id: grab
        if: inputs.check_posting != 'yes'
        working-directory: robot
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          TEST_GAME: ${{ inputs.test_game }}
          TEST_MAX: ${{ inputs.test_max }}
          TEST_KICK: ${{ inputs.test_kick }}
          PURGE_ALL: ${{ inputs.purge_all }}
          PURGE_IDS: ${{ inputs.purge_ids }}
          FIX_RAW: ${{ inputs.fix_raw }}
        run: python grab.py
      - name: Start Claude on the auto-picked clips
        if: steps.grab.outputs.auto_picked != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hooks.yml -R ${{ github.repository }}
      - name: YouTube stats into the sheet (every ~2h; skipped until posting is set up)
        if: always()
        continue-on-error: true
        working-directory: robot
        env:
          UPLOAD_POST_KEY: ${{ secrets.UPLOAD_POST_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python -u analytics.py
      - name: Post the videos you approved on the Review tab (and do redos)
        if: always() && inputs.check_posting != 'yes'
        continue-on-error: true
        working-directory: robot
        env:
          UPLOAD_POST_KEY: ${{ secrets.UPLOAD_POST_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python -u poster.py
