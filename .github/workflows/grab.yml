name: Grab GTA 6 clips

on:
  schedule:
    - cron: "17,47 * * * *"   # every 30 min (UTC). Two slots so one delayed/skipped GitHub run is never a big gap.
  workflow_dispatch:           # "Run workflow" button for a manual run
    inputs:
      test_game:
        description: "TEST ONLY: grab from this Twitch category instead (e.g. Grand Theft Auto V). Leave blank for normal."
        required: false
        default: ""
      test_max:
        description: "TEST ONLY: max clips to grab"
        required: false
        default: "5"

concurrency:
  group: grab
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (always the newest yt-dlp, so Twitch changes get picked up)
        run: pip install --upgrade -r requirements.txt
      - name: Grab clips
        working-directory: robot
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          TEST_GAME: ${{ inputs.test_game }}
          TEST_MAX: ${{ inputs.test_max }}
        run: python grab.py
