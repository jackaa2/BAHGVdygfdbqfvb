name: Write hooks for approved clips (Claude)

on:
  workflow_dispatch: {}

concurrency:
  group: hooks
  cancel-in-progress: false

jobs:
  hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hooks-whisper-base-en-v1
      - name: Install
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            (curl -sSfL --max-time 150 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              && tar -xf /tmp/ff.tar.xz -C /tmp && sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ff* /usr/local/bin/) \
            || (timeout 120 sudo apt-get update -qq; timeout 240 sudo apt-get install -y -qq ffmpeg)
          fi
          ffmpeg -hide_banner -filters 2>/dev/null | grep -q " ass " && echo "ffmpeg ok (with captions)"
          pip install -q requests faster-whisper numpy
      - name: Claude writes 3 hooks per approved clip
        working-directory: robot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python screen.py
